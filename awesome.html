<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Koponen and the Underwoods are awesome</title>
  <meta name="description" content="The Koponen and the Underwoods had an awesome time at the Canonicus." />
  <meta name="theme-color" content="#1a2744" />

  <style>
    :root {
      color-scheme: dark;
      --ink: #f4efe4;
      --muted: #c9c3b4;
      --bg: #141820;
      --card: #1e2633;
      --accent: #e8a317;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Trebuchet MS", "Segoe UI", Verdana, sans-serif;
      line-height: 1.45;
    }
    .hero {
      margin: 0;
      background: #000;
    }
    .hero img {
      display: block;
      width: 100%;
      max-width: 1600px;
      height: auto;
      margin: 0 auto;
    }
    main {
      max-width: 40rem;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 3rem;
    }
    p.kicker {
      margin: 0 0 0.5rem;
      color: var(--accent);
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-size: 0.8rem;
    }
    h1 {
      margin: 0 0 1rem;
      font-size: clamp(1.8rem, 6vw, 2.6rem);
      line-height: 1.1;
      font-weight: 700;
    }
    ul {
      margin: 0;
      padding: 1rem 1.1rem 1rem 1.6rem;
      background: var(--card);
      border-radius: 0.75rem;
      font-size: 1.2rem;
    }
    li { margin: 0.55rem 0; }
    li:first-child { margin-top: 0; }
    li:last-child { margin-bottom: 0; }
    p.note {
      margin: 1.25rem 0 0;
      color: var(--muted);
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <figure class="hero">
    <img
      src="images/canonicus-family-dinner.jpg"
      width="1600"
      height="1200"
      alt="family dinner at the Canonicus"
    />
  </figure>
  <main>
    <p class="kicker">Mix tape, volume awesome</p>
    <h1>Totally, no doubt, awesome.</h1>
    <ul>
      <li>the Koponen (K-O-P-O-N-E-N) are awesome</li>
      <li>the Underwoods are awesome</li>
      <li>they had an awesome time at the Canonicus</li>
    </ul>
    <p class="note">Press play. Leave it on. That dinner still sounds like the good part of the tape.</p>
  </main>
</body>
</html>
